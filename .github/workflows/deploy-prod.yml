name: Deploy — Production (master)

on:
  push:
    branches:
      - master
    paths:
      - 'Databricks_Lakeflow_Pipeline/resources/**'
      - 'Databricks_Lakeflow_Pipeline/databricks.yml'
      - 'wanderbricks_dlt_pipeline/**'
      - '.github/workflows/deploy-prod.yml'

  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-TO-PROD to confirm"
        required: true

jobs:
  safety-check:
    name: Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-TO-PROD" ]; then
            echo "❌ Wrong confirmation phrase. Aborting."
            exit 1
          fi
          echo "✅ Confirmed. Proceeding."

  deploy-master:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: safety-check
    environment: prod

    defaults:
      run:
        working-directory: Databricks_Lakeflow_Pipeline

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target master

      - name: Deploy to production
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target master

      - name: Tag deployment in Git
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "deployed-prod-$(date +%Y%m%d-%H%M%S)"
          git push origin --tags

      - name: Print summary
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "✅ Production deployment complete"
          databricks bundle summary --target master