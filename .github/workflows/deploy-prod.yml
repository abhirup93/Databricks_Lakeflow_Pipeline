name: Deploy — Production (master)

on:
  # Only triggers when manually started with correct confirmation phrase
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-TO-PROD to confirm"
        required: true

jobs:
  safety-check:
    name: Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-TO-PROD" ]; then
            echo "❌ Wrong confirmation phrase. Aborting."
            exit 1
          fi
          echo "✅ Confirmed. Proceeding to production."

  deploy-master:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: safety-check
    environment: prod
    # ↑ GitHub pauses here — requires approvers to click
    #   "Approve and deploy" before any steps run

    defaults:
      run:
        working-directory: wanderbricks_medallion_pipeline

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master   # ← always deploys from master branch

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target master

      - name: Deploy to production
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target master

      - name: Tag deployment in Git
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "deployed-prod-$(date +%Y%m%d-%H%M%S)"
          git push origin --tags

      - name: Print summary
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "✅ Production deployment complete"
          databricks bundle summary --target master
