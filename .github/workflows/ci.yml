name: CI — Validate Bundle

# Runs when a PR is opened or updated targeting any main branch
on:
  pull_request:
    branches:
      - dev
      - uat
      - master
    paths:
      - 'resources/**'
      - 'databricks.yml'
      - 'wanderbricks_dlt_pipeline/**'

jobs:
  validate:
    name: Validate DAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev
        # We validate against dev target — catches all config errors
        # without touching uat or prod resources