name: Deploy — Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'Databricks_Lakeflow_Pipeline/wanderbricks_medallion_pipeline/resources/**'
      - 'Databricks_Lakeflow_Pipeline/wanderbricks_medallion_pipeline/databricks.yml'
      - 'Databricks_Lakeflow_Pipeline/**'
      - 'Databricks_Lakeflow_Pipeline/.github/workflows/deploy-dev.yml'

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: Databricks_Lakeflow_Pipeline

    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

      - name: Deploy to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target dev

      - name: Print summary
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "✅ Dev deployment complete"
          databricks bundle summary --target dev