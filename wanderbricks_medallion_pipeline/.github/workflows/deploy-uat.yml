name: Deploy — UAT

on:
  # Only triggers when manually started from GitHub Actions UI
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to deploy from (should be uat)"
        required: true
        default: "uat"

jobs:
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    environment: uat
    # ↑ GitHub pauses here and waits for reviewer approval
    #   before running any steps below

    defaults:
      run:
        working-directory: Databricks_Lakeflow_Pipeline

    concurrency:
      group: deploy-uat
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: uat    # ← always deploys from uat branch

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target uat

      - name: Deploy to UAT
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target uat

      - name: Print summary
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "✅ UAT deployment complete"
          databricks bundle summary --target uat