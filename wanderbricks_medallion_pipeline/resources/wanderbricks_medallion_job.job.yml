resources:
  jobs:
    wanderbricks_medallion_job:
      name: wanderbricks_medallion_job - ${bundle.target}
      tasks:
        - task_key: run_wanderbricks_pipeline
          email_notifications: {}
          pipeline_task:
            full_refresh: true
            pipeline_id: ${resources.pipelines.wanderbricks_medallion_pipeline.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: PAUSED
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: Asia/Calcutta
      tags:
        "aidevkit_project": "ai-dev-kit"
        "created_by": "databricks-ai-dev-kit"
        "layer": "medallion"
        "pipeline": "wanderbricks_medallion_pipeline"
        "project": "wanderbricks_dlt"
        "schedule": "6am_IST"
        "team": "data_engineering"
        "environment": ${bundle.target}
        "managed_by": databricks-asset-bundles
      timeout_seconds: 0
      webhook_notifications: {}
