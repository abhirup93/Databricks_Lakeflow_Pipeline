resources:
  pipelines:
    wanderbricks_medallion_pipeline:
      name: wanderbricks_medallion_pipeline
      libraries:
        - glob:
            include: ../src/ingestion/bronze/bronze_bookings.sql
        - glob:
            include: ../src/ingestion/bronze/bronze_properties.sql
        - glob:
            include: ../src/ingestion/bronze/bronze_reviews.sql
        - glob:
            include: ../src/transformations/silver/silver_bookings.sql
        - glob:
            include: ../src/transformations/silver/silver_properties.sql
        - glob:
            include: ../src/transformations/gold/gold_price_prediction.sql
        - glob:
            include: ../src/transformations/gold/gold_property_performance.sql
      catalog: ${var.catalog}
      channel: CURRENT
      continuous: false
      photon: true
      root_path: ../src
      schema: ${var.schema}
      serverless: true
      tags:
        aidevkit_project: ai-dev-kit
        created_by: databricks-ai-dev-kit
        layer: medallion
        pipeline: wanderbricks_medallion_pipeline
        project: wanderbricks_dlt
        schedule: 6am_IST
        team: data_engineering
        environment: ${bundle.target}
        managed_by: databricks-asset-bundles
